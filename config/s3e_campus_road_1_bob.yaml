# 纯激光、CPU建图。无需预建地图，第一帧雷达坐标系作为map系。
sensor:
  lidar_topic: "/Bob/velodyne_points"
  min_range: 1.0
  max_range: 100.0
  # 点内时间相对header.stamp；time通常是float秒，t常为uint32纳秒。
  time_field: "time"
  time_scale: 1.0
  # 仅使用前两帧运动估计作恒速去畸变，不订阅IMU/GPS；缺少时间字段时使用原点云。
  deskew: true

# 扫描线深度滤波选点；false保留当前全量点云NDT链路。
features:
  enabled: false
  highpass_half_window: 3       # 高通窗口2h+1个点，按ring内方位角排列
  highpass_threshold: 0.005    # |原始深度-局部均值|/深度，越小corner越多
  lowpass_half_window: 3        # 低通窗口2s+1；残差能量再用相同窗口统计
  lowpass_threshold: 0.0015    # 归一化残差RMS，越大surface候选越多
  max_gap_deg: 2.0             # 不跨越比此角度更大的扫描线缺口
  occlusion_depth_ratio: 0.05  # 深度跳变比例，屏蔽遮挡远侧与孤立尖峰

ndt:
  num_layers: 3  # 使用resolutions/weights前N项；增加层数时补齐对应项
  # 每轮所有层同时参与。weights与resolutions一一对应，内部归一化到权重和为1。
  resolutions: [2.0, 1.0, 0.5]
  weights: [1.0, 1.0, 1.0]
  source_voxel: 0.3
  num_threads: 4
  max_iterations: 30
  epsilon: 0.005
  max_step: 0.3

mapping:
  keyframe_distance: 1.0
  keyframe_angle: 0.2   # rad
  keyframe_time: 2.0   # s，只对收敛帧保存关键帧
  keyframe_voxel: 0.15
  submap_radius: 50.0
  submap_keyframes: 20

# 后端图优化与回环；频率按雷达时间计算，ICP在独立线程运行。
loop:
  loopClosureEnableFlag: true
  loopClosureFrequency: 1.0
  historyKeyframeSearchRadius: 15.0   # m
  historyKeyframeSearchTimeDiff: 30.0 # s
  historyKeyframeSearchNum: 25
  historyKeyframeFitnessScore: 0.3   # ICP均方误差，m²；越小要求越严格
  mappingSurfLeafSize: 0.4          # 回环点云降采样，m

output:
  with_ui: true
  pub_tf: true
  map_frame: "map"
  lidar_frame: "lidar"
  save_path: "./maps/multi_layer_ndt"
  save_voxel: 0.1
